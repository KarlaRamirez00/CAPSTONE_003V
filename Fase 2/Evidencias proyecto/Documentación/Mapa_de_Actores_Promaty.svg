<svg width="800" viewBox="0 0 680 580" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Mapa de Actores — Promaty</title>
<desc>Diagrama circular con Promaty en el centro. Anillo interior: usuarios directos (Jefatura de CC, Encargado RRHH, Administrador, Karla Ramírez). Anillo exterior: partes interesadas (Colaborador, Comisión DuocUC, Promaty organización cliente).</desc>

<defs>
  <style>
    text { font-family: Calibri, Arial, sans-serif; }
    .th { font-size: 14px; font-weight: 600; fill: #0C447C; }
    .ts { font-size: 12px; font-weight: 400; fill: #185FA5; }
    .th-teal { font-size: 14px; font-weight: 600; fill: #085041; }
    .ts-teal { font-size: 12px; font-weight: 400; fill: #0F6E56; }
    .th-purple { font-size: 14px; font-weight: 600; fill: #3C3489; }
    .ts-purple { font-size: 12px; font-weight: 400; fill: #534AB7; }
    .th-coral { font-size: 14px; font-weight: 600; fill: #712B13; }
    .ts-coral { font-size: 12px; font-weight: 400; fill: #993C1D; }
    .ts-legend { font-size: 12px; font-weight: 400; fill: #3d3d3a; }
  </style>
</defs>

<!-- Background -->
<rect width="680" height="580" fill="#ffffff"/>

<!-- Dashed rings -->
<circle cx="340" cy="295" r="145" fill="none" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="5 4"/>
<circle cx="340" cy="295" r="220" fill="none" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="5 4"/>

<!-- Connector lines -->
<line x1="340" y1="295" x2="340" y2="176" stroke="#888780" stroke-width="0.5"/>
<line x1="340" y1="295" x2="407" y2="295" stroke="#888780" stroke-width="0.5"/>
<line x1="340" y1="295" x2="340" y2="414" stroke="#888780" stroke-width="0.5"/>
<line x1="340" y1="295" x2="273" y2="295" stroke="#888780" stroke-width="0.5"/>
<line x1="340" y1="295" x2="203" y2="177" stroke="#888780" stroke-width="0.5"/>
<line x1="340" y1="295" x2="477" y2="177" stroke="#888780" stroke-width="0.5"/>
<line x1="340" y1="295" x2="340" y2="489" stroke="#888780" stroke-width="0.5"/>

<!-- Center: Promaty -->
<circle cx="340" cy="295" r="52" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
<text class="th" x="340" y="287" text-anchor="middle" dominant-baseline="central">Promaty</text>
<text class="ts" x="340" y="305" text-anchor="middle" dominant-baseline="central">Sistema RRHH</text>

<!-- Inner ring: Jefatura de CC (top) -->
<rect x="262" y="124" width="156" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th-teal" x="340" y="141" text-anchor="middle" dominant-baseline="central">Jefatura de CC</text>
<text class="ts-teal" x="340" y="161" text-anchor="middle" dominant-baseline="central">Nivel 1 aprobación</text>

<!-- Inner ring: Encargado RRHH (right) -->
<rect x="407" y="269" width="156" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th-teal" x="485" y="286" text-anchor="middle" dominant-baseline="central">Encargado RRHH</text>
<text class="ts-teal" x="485" y="306" text-anchor="middle" dominant-baseline="central">Nivel 2 + gestión</text>

<!-- Inner ring: Administrador (bottom) -->
<rect x="262" y="414" width="156" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th-teal" x="340" y="431" text-anchor="middle" dominant-baseline="central">Administrador</text>
<text class="ts-teal" x="340" y="451" text-anchor="middle" dominant-baseline="central">Accesos y usuarios</text>

<!-- Inner ring: Karla Ramírez (left, purple - developer) -->
<rect x="117" y="269" width="156" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th-purple" x="195" y="286" text-anchor="middle" dominant-baseline="central">Karla Ramírez</text>
<text class="ts-purple" x="195" y="306" text-anchor="middle" dominant-baseline="central">Desarrolladora</text>

<!-- Outer ring: Colaborador (upper-left) -->
<rect x="98" y="125" width="150" height="52" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="th-coral" x="173" y="142" text-anchor="middle" dominant-baseline="central">Colaborador</text>
<text class="ts-coral" x="173" y="162" text-anchor="middle" dominant-baseline="central">Sujeto gestionado</text>

<!-- Outer ring: Comisión DuocUC (upper-right) -->
<rect x="432" y="125" width="150" height="52" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="th-coral" x="507" y="142" text-anchor="middle" dominant-baseline="central">Comisión DuocUC</text>
<text class="ts-coral" x="507" y="162" text-anchor="middle" dominant-baseline="central">Evaluadora Duoc</text>

<!-- Outer ring: Promaty organización cliente (bottom) -->
<rect x="265" y="489" width="150" height="52" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="th-coral" x="340" y="506" text-anchor="middle" dominant-baseline="central">Promaty</text>
<text class="ts-coral" x="340" y="526" text-anchor="middle" dominant-baseline="central">Organización cliente</text>

<!-- Title badge (orange pill) -->
<rect x="40" y="22" width="196" height="34" rx="17" fill="#FAC775"/>
<text x="138" y="39" text-anchor="middle" dominant-baseline="central" font-family="Calibri, Arial, sans-serif" font-size="13" font-weight="600" fill="#633806">Mapa de actores</text>

<!-- Legend -->
<rect x="40" y="554" width="12" height="12" rx="3" fill="#1D9E75"/>
<text class="ts-legend" x="58" y="560" dominant-baseline="central">Usuarios directos</text>
<rect x="200" y="554" width="12" height="12" rx="3" fill="#D85A30"/>
<text class="ts-legend" x="218" y="560" dominant-baseline="central">Partes interesadas</text>
<rect x="380" y="554" width="12" height="12" rx="3" fill="#534AB7"/>
<text class="ts-legend" x="398" y="560" dominant-baseline="central">Equipo del proyecto</text>

</svg>
