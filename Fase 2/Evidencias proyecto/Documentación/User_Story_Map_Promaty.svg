<title>User Story Map — Promaty</title>
<desc>Mapa de historias de usuario de Promaty organizado cronológicamente por actividad de usuario y sprint. Actividades: Acceder y configurar, Gestionar proyectos y CC, Registrar colaboradores, Tramitar contratos, Aprobar solicitudes, Controlar ciclo laboral, Asistencia y remuneraciones.</desc>

